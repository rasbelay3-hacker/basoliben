<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የባሶሊበን ወጣቶች ኦንላይን ሎተሪ ማህበር</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 450px; margin: 0 auto; }
        .header { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .card h2 { margin-top: 0; color: #0d6efd; font-size: 18px; border-bottom: 2px solid #f0f2f5; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; }
        .btn { width: 100%; background: #198754; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #157347; }
        .notice { background: #fff3cd; border: 1px solid #ffe69c; color: #664d03; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>የባሶሊበን ወጣቶች ኦንላይን ሎተሪ ማህበር</h1>
    </div>

    <div class="notice">
        📌 <b>ማሳሰቢያ፡</b> ዕጣ ከቆረጡ በኋላ የክፍያ ማረጋገጫ ቁጥሩን (Txn ID) ማስገባትዎን አይርሱ!
    </div>

    <div class="card">
        <h2>🎟️ ዕለታዊ ሎተሪ ቁረጥ</h2>
        
        <div class="form-group">
            <label>ሙሉ ስም</label>
            <input type="text" id="fullname" placeholder="ስምዎን ያስገቡ">
        </div>

        <div class="form-group">
            <label>የስልክ ቁጥር (ቴሌብር)</label>
            <input type="tel" id="phone" placeholder="09........">
        </div>

        <div class="form-group">
            <label>የሎተሪ ዓይነት ይምረጡ</label>
            <select id="lotteryType">
                <option value="5">በ 5 ብር - 250 ብር ደራሽ</option>
                <option value="10">በ 10 ብር - 1,000 ብር ደራሽ</option>
                <option value="20">በ 20 ብር - 2,500 ብር ደራሽ</option>
            </select>
        </div>

        <button class="btn" onclick="submitTicket()">በቴሌብር ይክፈሉ እና ዕጣ ይቁረጡ</button>
    </div>
</div>

<script>
function submitTicket() {
    var name = document.getElementById('fullname').value;
    var phone = document.getElementById('phone').value;
    var amount = document.getElementById('lotteryType').value;

    if(!name || !phone) {
        alert("እባክዎን ስምዎን እና የስልክ ቁጥርዎን ያስገቡ!");
        return;
    }

    alert("ሰላም " + name + "! ወደ ቴሌብር በመሄድ የ " + amount + " ብር ክፍያ ለ 0988721313 ይፈጽሙ።");
    window.location.href = "tel:*806*0988721313*" + amount + "%23";
}
</script>

</body>
</html>
