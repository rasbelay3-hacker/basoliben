<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የባሶሊበን ወጣቶች ኦንላይን እቁብ ማህበር</title>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: #ffffff;
            padding: 20px;
            margin: 0 auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 { color: #1e3a8a; }
        p { font-size: 14px; color: #555; }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label { font-weight: bold; font-size: 13px; display: block; margin-bottom: 5px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h2>የባሶሊበን ወጣቶች እቁብና ሎተሪ</h2>
    <p>ክፍያ በቴሌብር (0988721313) ከፈፀሙ በኋላ መረጃዎን ያስገቡ</p>
    
    <form id="equbForm">
        <div class="input-group">
            <label>ስልክ ቁጥር:</label>
            <input type="text" id="phone" placeholder="09..." required>
        </div>
        <div class="input-group">
            <label>የዕጣ / ሎተሪ ቁጥር:</label>
            <input type="number" id="ticket" placeholder="ምሳሌ፡ 5" required>
        </div>
        <button type="submit" id="submitBtn">መረጃውን ላክ</button>
    </form>
</div>

<script>
    // Supabase ማገናኛ
    const SUPABASE_URL = 'https://crkbpmksuhzlpdignery.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_fcobv7kpWIluf6C6ZxwplQ_njVh2WFL';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Form Submit ሲደረግ የሚሰራ
    document.getElementById('equbForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const phone = document.getElementById('phone').value;
        const ticket = document.getElementById('ticket').value;
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.innerText = 'እየላከ ነው...';
        submitBtn.disabled = true;

        const { data, error } = await supabaseClient
            .from('users')
            .insert([{ phone: phone, ticket_number: parseInt(ticket) }]);

        if (error) {
            alert('ስህተት ተፈጥሯል፡ ' + error.message);
        } else {
            alert('መረጃዎ በተሳካ ሁኔታ ተልኳል!');
            document.getElementById('equbForm').reset();
        }

        submitBtn.innerText = 'መረጃውን ላክ';
        submitBtn.disabled = false;
    });
</script>

</body>
</html>
