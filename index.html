<!DOCTYPE html>

    <style>

            background-color: #f4f6f9;

            padding: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .container {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #1a365d;
        }
        .card-title {
            text-align: center;
            color: #1a365d;

            font-weight: bold;
            margin-top: 0;
        }
        .info-box {

            padding: 15px;

        }
        .select-box {

            padding: 12px;

            border: 1px solid #ccc;

            margin-top: 10px;

        }
        .btn {

            font-size: 18px;

            margin-top: 15px;

<body>

    <div class="header">

    <script>
        function payLottery() {

            var phone = "0988721313";
            alert("ሎተሪ ለመቁረጥ ወደ " + phone + " የ " + amount + " ብር ክፍያ ያድርጉ!");

            window.location.href = "tel:*806*" + phone + "*" + amount + "%23";
        }
    </script>

</html>
